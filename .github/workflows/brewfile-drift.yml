name: Brewfile drift

# Brew can rename/remove packages (e.g. docker -> docker-desktop).
# Drift is checked automatically on a fresh-machine
# install (setup_homebrew.zsh runs the drift script the one time Homebrew is
# freshly installed).
# This workflow stays for on-demand pre-provision checks from the Actions tab.

on:
  workflow_dispatch:

jobs:
  drift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Check every Brewfile token still resolves upstream
        run: ./test/brewfile-drift.sh
